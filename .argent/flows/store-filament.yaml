# Scene 8 of 8 — the per-toolhead filament editor.
# Depends on store-home having run first in the same capture: goldie installs
# the APK once per run, so the printer configured there persists across flows
# (launch: does not clear data). This flow cannot declare executionPrerequisite
# because it starts with launch: — the two are mutually exclusive.
#
# Tabs are selected by their visible label. The bottom bar labels are real text
# ("Files", "Slice", "Tools"), so no coordinates are needed.

steps:
  - launch: org.crabcore.u1control
  - await:
      visible:
        text: TOOLHEADS
  # Opens the editor for toolhead 1. "T1" is the card's own label.
  - tap:
      text: T1
  - await:
      visible:
        text: Save filament
  - wait: 1500
